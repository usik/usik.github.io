<section class="page__share">
  {% assign _url = page.url | absolute_url %}
  <h4 class="page__share-title">공유하기</h4>

  <a href="https://t.me/share/url?url={{ _url | url_encode }}&text={{ page.title | url_encode }}" class="btn btn--info" onclick="window.open(this.href,'w','width=560,height=560'); return false;" title="텔레그램 공유"><i class="fab fa-fw fa-telegram" aria-hidden="true"></i><span> 텔레그램</span></a>

  <a href="https://twitter.com/intent/tweet?text={{ page.title | url_encode }}%20{{ _url | url_encode }}" class="btn btn--twitter" onclick="window.open(this.href,'w','width=560,height=560'); return false;" title="트위터 공유"><i class="fab fa-fw fa-twitter" aria-hidden="true"></i><span> 트위터</span></a>

  {% if site.kakao_key %}
  <a href="#" id="kakao-share" class="btn" style="background:#FEE500;color:#191600" title="카카오톡 공유"><i class="fas fa-fw fa-comment" aria-hidden="true"></i><span> 카카오톡</span></a>
  {% endif %}

  {% if page.header.insta_image %}
  <a href="{{ page.header.insta_image | absolute_url }}" download class="btn" style="background:#E1306C;color:#fff" title="인스타 카드 이미지 저장"><i class="fab fa-fw fa-instagram" aria-hidden="true"></i><span> 인스타 카드</span></a>
  {% endif %}

  <a href="#" class="btn btn--inverse" onclick="navigator.clipboard.writeText('{{ _url }}'); this.querySelector('span').textContent=' 복사됨!'; return false;" title="링크 복사"><i class="fas fa-fw fa-link" aria-hidden="true"></i><span> 링크복사</span></a>
</section>

{% if site.kakao_key %}
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
<script>
(function(){
  if (window.Kakao && !Kakao.isInitialized()) { Kakao.init('{{ site.kakao_key }}'); }
  var b = document.getElementById('kakao-share');
  if (b && window.Kakao) {
    b.addEventListener('click', function(e){
      e.preventDefault();
      Kakao.Share.sendDefault({
        objectType: 'feed',
        content: {
          title: {{ page.title | jsonify }},
          description: {{ page.excerpt | strip_html | truncate: 100 | jsonify }},
          imageUrl: '{{ page.header.og_image | absolute_url }}',
          link: { mobileWebUrl: '{{ _url }}', webUrl: '{{ _url }}' }
        }
      });
    });
  }
})();
</script>
{% endif %}
