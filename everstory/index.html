const SIGNUP_ENDPOINT=''; // Set your deployed Google Apps Script /exec URL.
function waitStatus(id, endpoint, timeoutMs=16000){
 return new Promise((resolve,reject)=>{
  const callback='everstoryCallback_'+id.replace(/-/g,'_');
  let done=false,timer=null,attempts=0,script=null;
  const cleanup=()=>{done=true;clearTimeout(timer);if(script)script.remove();delete window[callback]};
  function poll(){
   if(done)return;
   if(++attempts>14){cleanup();reject(Error('timeout'));return}
   script=document.createElement('script');
   script.src=endpoint+'?action=status&request_id='+encodeURIComponent(id)+'&callback='+callback+'&_='+Date.now();
   script.onerror=()=>{script.remove();timer=setTimeout(poll,1100)};
   document.head.append(script);
  }
  window[callback]=data=>{if(done)return;if(data&&data.ok){cleanup();resolve(data)}else if(data&&data.code!=='pending'){cleanup();reject(Error(data.code||'failed'))}else{if(script)script.remove();timer=setTimeout(poll,1100)}};
  timer=setTimeout(()=>{cleanup();reject(Error('timeout'))},timeoutMs);
  poll();
 });
}
document.getElementById('signup').addEventListener('submit',async e=>{
 e.preventDefault();const status=document.getElementById('status');
 if(!document.getElementById('consent').checked)return;
 if(!SIGNUP_ENDPOINT){status.textContent=strings[current].unavailable;return}
 const btn=e.target.querySelector('button');btn.disabled=true;status.textContent='…';
 const id=crypto.randomUUID?crypto.randomUUID():('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx').replace(/[xy]/g,c=>(Math.random()*16|0).toString(16));
 const q=new URLSearchParams(location.search);
 const payload=new URLSearchParams({email:document.getElementById('email').value.trim(),language:current,utm_source:q.get('utm_source')||'direct',utm_medium:q.get('utm_medium')||'',utm_campaign:q.get('utm_campaign')||'',consent:'yes',website:document.getElementById('website').value,request_id:id});
 try{
  await fetch(SIGNUP_ENDPOINT,{method:'POST',mode:'no-cors',body:payload});
  await waitStatus(id,SIGNUP_ENDPOINT);
  status.textContent=strings[current].success;e.target.reset();
 }catch(err){status.textContent=strings[current].error+' (Submission not confirmed.)';console.error(err)}finally{btn.disabled=false}
});
