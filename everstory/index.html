let current=new URLSearchParams(location.search).get('lang')||localStorage.getItem('everstory-lang')||'ko';if(!strings[current])current='ko';let activeGenre='all',activeChar=characters[0],sceneNum=0,lastChoice='';const $=id=>document.getElementById(id);

function renderCards(){let q=$('search').value.toLowerCase().trim();let matches=characters.filter(c=>(activeGenre==='all'||c.tags.includes(activeGenre)||c.genre===activeGenre)&&(!q||[...Object.values(c.names),...Object.values(c.descs),c.tagsText,c.genre].join(' ').toLowerCase().includes(q)));$('cards').replaceChildren();$('count').textContent=matches.length+' '+strings[current].count;$('empty').classList.toggle('hidden',matches.length>0);$('empty').textContent=strings[current].empty;matches.forEach(c=>{const b=document.createElement('button');b.className='character';b.setAttribute('aria-label',c.names[current]);b.innerHTML='<div class="poster"><img loading="lazy" alt=""><span class="genre"></span><span class="poster-bot">✦ EVERSTORY ORIGINAL</span></div><div class="ctitle"></div><div class="cdesc"></div><div class="ctags"></div>';b.querySelector('img').src=c.image;b.querySelector('img').alt=c.names[current];b.querySelector('.genre').textContent=strings[current][c.genre];b.querySelector('.ctitle').textContent=c.names[current];b.querySelector('.cdesc').textContent=c.descs[current];b.querySelector('.ctags').textContent=c.tagsText;b.onclick=()=>{activeChar=c;sceneNum=0;lastChoice='';open('storyOverlay');renderStory()};$('cards').append(b)})}
function open(id){$(id).classList.add('open');document.body.style.overflow='hidden'}function close(id){$(id).classList.remove('open');if(!document.querySelector('.overlay.open'))document.body.style.overflow=''}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll('.overlay').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)close(el.id)}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay.open').forEach(el=>close(el.id))});document.querySelectorAll('[data-open-signup]').forEach(b=>b.onclick=()=>open('signupOverlay'));$('heroStart').onclick=()=>{activeChar=characters[0];sceneNum=0;lastChoice='';open('storyOverlay');renderStory()};$('search').oninput=renderCards;document.querySelectorAll('[data-genre]').forEach(el=>el.onclick=()=>{activeGenre=el.dataset.genre;renderFilters();renderCards()});$('lang').onchange=e=>{current=e.target.value;localStorage.setItem('everstory-lang',current);render()};
function renderStory(){const s=strings[current],c=activeChar,scenes=sceneSets[current];$('detailImg').src=c.image;$('detailImg').alt=c.names[current];$('detailNameArt').textContent=c.names[current];$('detailGenre').textContent=s[c.genre]+' · '+(sceneNum<scenes.length?`${sceneNum+1} / ${scenes.length}`:'PREVIEW');$('detailTitle').textContent=c.names[current];$('detailSummary').textContent=c.descs[current];$('choices').replaceChildren();$('previewNote').textContent=s.note;if(sceneNum>=scenes.length){$('scene').textContent=s.end+'\n\n'+s.last+' '+lastChoice;const b=document.createElement('button');b.className='choice';b.textContent=s.again;b.onclick=()=>{sceneNum=0;lastChoice='';renderStory()};$('choices').append(b);const more=document.createElement('button');more.className='solid';more.textContent=s.more;more.onclick=()=>{close('storyOverlay');open('signupOverlay')};$('choices').append(more);return}const sc=scenes[sceneNum];$('scene').textContent=sc.line+'\n'+(lastChoice?'\n'+s.last+' '+lastChoice:'');sc.choices.forEach((o,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=(i+1)+'.  '+o;b.onclick=()=>next(o);$('choices').append(b)});const free=document.createElement('div');free.className='free';const inp=document.createElement('input');inp.maxLength=240;inp.placeholder='4. '+s.own;const send=document.createElement('button');send.textContent=s.send;send.onclick=()=>{if(inp.value.trim())next(inp.value.trim())};inp.onkeydown=e=>{if(e.key==='Enter')send.click()};free.append(inp,send);$('choices').append(free)}function next(choice){lastChoice=choice;sceneNum++;renderStory()}

const SIGNUP_ENDPOINT=''; // Set your deployed Google Apps Script /exec URL.
function waitStatus(id, endpoint, timeoutMs=16000){
 return new Promise((resolve,reject)=>{
  const callback='everstoryCallback_'+id.replace(/-/g,'_');
  let done=false,timer=null,attempts=0,script=null;
  const cleanup=()=>{done=true;clearTimeout(timer);if(script)script.remove();delete window[callback]};
  function poll(){
   if(done)return;
   if(++attempts>14){cleanup();reject(Error('timeout'));return}
   script=document.createElement('script');
   script.src=endpoint+'?action=status&request_id='+encodeURIComponent(id)+'&callback='+callback+'&_='+Date.now();
   script.onerror=()=>{script.remove();timer=setTimeout(poll,1100)};
   document.head.append(script);
  }
  window[callback]=data=>{if(done)return;if(data&&data.ok){cleanup();resolve(data)}else if(data&&data.code!=='pending'){cleanup();reject(Error(data.code||'failed'))}else{if(script)script.remove();timer=setTimeout(poll,1100)}};
  timer=setTimeout(()=>{cleanup();reject(Error('timeout'))},timeoutMs);
  poll();
 });
}
document.getElementById('signup').addEventListener('submit',async e=>{
 e.preventDefault();const status=document.getElementById('status');
 if(!document.getElementById('consent').checked)return;
 if(!SIGNUP_ENDPOINT){status.textContent=strings[current].unavailable;return}
 const btn=e.target.querySelector('button');btn.disabled=true;status.textContent='…';
 const id=crypto.randomUUID?crypto.randomUUID():('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx').replace(/[xy]/g,c=>(Math.random()*16|0).toString(16));
 const q=new URLSearchParams(location.search);
 const payload=new URLSearchParams({email:document.getElementById('email').value.trim(),language:current,utm_source:q.get('utm_source')||'direct',utm_medium:q.get('utm_medium')||'',utm_campaign:q.get('utm_campaign')||'',consent:'yes',website:document.getElementById('website').value,request_id:id});
 try{
  await fetch(SIGNUP_ENDPOINT,{method:'POST',mode:'no-cors',body:payload});
  await waitStatus(id,SIGNUP_ENDPOINT);
  status.textContent=strings[current].success;e.target.reset();
 }catch(err){status.textContent=strings[current].error+' (Submission not confirmed.)';console.error(err)}finally{btn.disabled=false}
});
