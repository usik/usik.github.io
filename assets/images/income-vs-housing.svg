  <text x="40" y="217" font-size="14" fill="#444">주거비</text>
  <rect x="180" y="195" width="300" height="34" rx="4" fill="#2f6fed"/>
  <text x="490" y="217" font-size="15" font-weight="700" fill="#2f6fed">+11.6%</text>
