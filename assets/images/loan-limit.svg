<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <text x="320" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">수도권·규제지역 시가별 주담대 한도</text>
  <text x="320" y="64" text-anchor="middle" font-size="13" fill="#888">2026년 기준 · 단위: 억 원</text>
  <line x1="80" y1="300" x2="600" y2="300" stroke="#ddd" stroke-width="1.5"/>
  <!-- 15억 이하: 6억 -->
  <rect x="130" y="60" width="90" height="240" rx="4" fill="#2f6fed"/>
  <text x="175" y="50" text-anchor="middle" font-size="20" font-weight="700" fill="#2f6fed">6억</text>
  <text x="175" y="324" text-anchor="middle" font-size="14" fill="#444">15억 이하</text>
  <!-- 15~25억: 4억 -->
  <rect x="275" y="140" width="90" height="160" rx="4" fill="#5b8bf0"/>
  <text x="320" y="130" text-anchor="middle" font-size="20" font-weight="700" fill="#5b8bf0">4억</text>
  <text x="320" y="324" text-anchor="middle" font-size="14" fill="#444">15억~25억</text>
  <!-- 25억 초과: 2억 -->
  <rect x="420" y="220" width="90" height="80" rx="4" fill="#9cb8f6"/>
  <text x="465" y="210" text-anchor="middle" font-size="20" font-weight="700" fill="#7a9cf2">2억</text>
  <text x="465" y="324" text-anchor="middle" font-size="14" fill="#444">25억 초과</text>
  <text x="320" y="360" text-anchor="middle" font-size="12" fill="#aaa">집이 비쌀수록 빌릴 수 있는 돈은 오히려 줄어든다</text>
</svg>
